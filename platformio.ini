[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; C3 SuperMini boards: same as c3, with lower WiFi TX power. Use this one if the board
; can't hold a WiFi connection or its setup AP doesn't show up on your phone.
;   pio run -e c3-supermini -t upload
[env:c3-supermini]
extends = env:c3
build_flags =
    ${env:c3.build_flags}
    -DWIFI_TX_POWER=WIFI_POWER_8_5dBm
